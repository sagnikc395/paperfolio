<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperfolio — Read, highlight &amp; annotate papers</title>
    <style>
      /* Painted before any JS runs, so launching the app never flashes white.
         React replaces #boot when it mounts. */
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf8f3;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Held back so a fast launch shows nothing at all — the mark only
         appears if the wait is long enough to need explaining. */
      #boot span {
        font: 500 13px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a89f8c;
        opacity: 0;
        animation: boot-in 0.5s ease 0.45s forwards;
      }

      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot span {
          animation-duration: 0.01s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span>Paperfolio</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
